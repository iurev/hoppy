[project]
name = "session-zx-tests"
version = "0.1.0"
description = "Integration tests for session-zx.mjs"
requires-python = ">=3.11"
dependencies = [
    "coverage>=7.13.4",
    "pexpect>=4.8.0",
    "pytest>=7.0.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
timeout = 30
