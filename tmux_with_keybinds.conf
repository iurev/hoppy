# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'rickstaa/tmux-notify'
# set -g @plugin 'catppuccin/tmux'

# tmux-continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Catppuccin theme configuration
# set -g @catppuccin_flavour 'frappe' # or frappe, macchiato, latte

# Window indexing: main tmux (yu) starts at 0, inner tmux starts at 1
if-shell '[ "$(whoami)" = "yu" ]' {
    set -g base-index 0
} {
    set -g base-index 1
}

# Main status bar at top (for window tabs)
set -g status on
set -g status-position top
set -g status-bg '#007ACC'
set -g status-fg '#FFFFFF'
set -g status-left "#S | "
set -g status-left-length 20
set -g status-right ""

# Enable pane border status at bottom for git info
set -g pane-border-status bottom
set -g pane-border-format "#{?#{==:#(whoami),yu},#[bg=#FFB380#,fg=#333333],#{?#{m:u*,#(whoami)},#[bg=#A8E6A1#,fg=#333333],#[bg=#555555#,fg=#FFFFFF]}}#[bold] U:#(whoami) #{?#{==:#{host_short},yu-legion},#[bg=#007ACC#,fg=#FFFFFF],#[bg=#0098FF#,fg=#FFFFFF]}#[bold] M:#{host_short} || S:#{session_name} | #(gitmux -timeout 500ms -cfg /home/yu/my/tmux/.gitmux.conf \"#{pane_current_path}\")#[default]"
set -g pane-border-style fg='#D4D4D4'
set -g pane-active-border-style fg='#007ACC'

# Window (tab) styling
set -g window-status-current-style bg='#007ACC',fg='#FFFFFF'
set -g window-status-style bg='#007ACC',fg='#FFFFFF'
set -g window-status-current-format "[#I #W]"
set -g window-status-format "#I #W"

# Alt+number to select window
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-0 select-window -t 0

# Alt+arrow keys to switch windows
bind-key -n M-Left previous-window
bind-key -n M-Right next-window

# F1-F9 for ruru shortcuts
bind-key -n F1 run-shell "/home/yu/my/tmux/ruru.sh F1"
bind-key -n F2 run-shell "/home/yu/my/tmux/ruru.sh F2"
bind-key -n F3 run-shell "/home/yu/my/tmux/ruru.sh F3"
bind-key -n F4 run-shell "/home/yu/my/tmux/ruru.sh F4"
bind-key -n F5 run-shell "/home/yu/my/tmux/ruru.sh F5"
bind-key -n F6 run-shell "/home/yu/my/tmux/ruru.sh F6"
bind-key -n F7 run-shell "/home/yu/my/tmux/ruru.sh F7"
bind-key -n F8 run-shell "/home/yu/my/tmux/ruru.sh F8"
bind-key -n F9 run-shell "/home/yu/my/tmux/ruru.sh F9"

# F10 to list windows in current session only
bind-key -n F10 run-shell -t popup "TMUX_FZF_WINDOW_FILTER='#{==:#{session_name},#S}' TMUX_FZF_OPTIONS='-p -w 100% -h 100%' ~/.tmux/plugins/tmux-fzf/scripts/window.sh switch"

# F11 to list all windows
bind-key -n F11 run-shell -t popup "TMUX_FZF_OPTIONS='-p -w 100% -h 100%' ~/.tmux/plugins/tmux-fzf/scripts/window.sh switch"


# Ctrl+Shift+T to create new window
bind-key -n C-S-t new-window -c "#{pane_current_path}"

# Ctrl+Shift+U to enter copy mode
bind-key -n C-S-u copy-mode

# Prefix + u or Prefix + Ctrl+u to enter copy mode (same as Ctrl+Shift+U)
bind-key u copy-mode
bind-key C-u copy-mode

# Ctrl+Shift+R to run ruru.sh command launcher (using new-window with current path)
bind-key -n C-S-r new-window -c "#{pane_current_path}" "/home/yu/my/tmux/ruru.sh"

# Ctrl+Shift+O to switch to CAPITAL letter sessions only
bind-key -n C-S-o run-shell "/home/yu/my/tmux/hoppy popup-capital-switch"

# Ctrl+Shift+L to switch sessions (same as F12)
bind-key -n C-S-l run-shell "/home/yu/my/tmux/hoppy popup-switch"

# Prefix + l to switch sessions (same as Ctrl+Shift+L)
bind-key l run-shell "/home/yu/my/tmux/hoppy popup-switch"

# Ctrl+Shift+P to switch sessions filtered by git worktrees
bind-key -n C-S-p run-shell "/home/yu/my/tmux/hoppy popup-worktree-switch"

# Fix copy mode selection colors
set -g mode-style 'bg=colour4,fg=colour7'

# Enable notifications and escape sequence passthrough
set-option -g set-titles on
set-option -g allow-passthrough on
set-option -g set-clipboard on
set-option -g extended-keys always
set-option -g terminal-overrides ',*:Tc'
set-option -g terminal-overrides ',xterm*:Tc,kitty*:Tc'

# Kitty notification support
set-option -g terminal-features 'kitty:RGB:mouse:title:clipboard'
set-option -g default-terminal 'tmux-256color'
set-option -ga terminal-overrides ',kitty:Tc'


# ── Nested tmux: Ctrl+Shift+G passthrough toggle ──
# Terminology:
#   outer tmux = the tmux running on the host machine (whoami=yu)
#   inner tmux = the tmux running inside SSH/container (whoami!=yu)
#   active     = the tmux that receives keybindings right now
#   exceptions = keys that ALWAYS go to the outer tmux, even when inner is active
#
# How it works:
#   - By default, outer tmux is active (all keys go to outer)
#   - Press Ctrl+Shift+G → inner tmux becomes active
#     (outer hides its status bar/borders, all keys pass through to inner)
#   - Press Ctrl+Shift+G again → outer tmux becomes active again
#
# Exceptions (always reach outer tmux, even when inner is active):
#   Ctrl+Shift+G — toggle active between outer/inner
#   Ctrl+Shift+L — session switch
#   Ctrl+Shift+O — capital session switch
#   Ctrl+Shift+P — worktree session switch
#
# Only the outer tmux (yu) gets these bindings.
# The inner tmux skips this block entirely (whoami != yu).
if-shell '[ "$(whoami)" = "yu" ]' {
    # Ctrl+Shift+G: make inner tmux active (outer goes invisible)
    bind -T root C-S-g \
      set prefix None \;\
      set key-table off \;\
      set status off \;\
      set pane-border-status off \;\
      if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
      refresh-client -S

    # Ctrl+Shift+G: make outer tmux active again (outer UI restored)
    bind -T off C-S-g \
      set -u prefix \;\
      set -u key-table \;\
      set status on \;\
      set pane-border-status bottom \;\
      refresh-client -S

    # Exceptions: these always go to the outer tmux
    bind -T off C-S-l run-shell "/home/yu/my/tmux/hoppy popup-switch"
    bind -T off C-S-o run-shell "/home/yu/my/tmux/hoppy popup-capital-switch"
    bind -T off C-S-p run-shell "/home/yu/my/tmux/hoppy popup-worktree-switch"

    # Alt+0: escape passthrough and switch to outer tmux window 0
    # bind -T off M-0 \
    #   set -u prefix \;\
    #   set -u key-table \;\
    #   set status on \;\
    #   set pane-border-status bottom \;\
    #   refresh-client -S \;\
    #   select-window -t 0
}

# Prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Reload config shortcut
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Keep current directory for new windows and panes
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Vi mode keys
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Clipboard: xclip on main (yu), OSC 52 on internal (non-yu)
if-shell '[ "$(whoami)" = "yu" ]' {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
} {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
}

# Activity monitoring configuration (commented out)
# Monitor for activity in windows
# setw -g monitor-activity on

# Display a message when activity occurs
# set -g visual-activity on

# Highlight windows with activity in status bar
# setw -g window-status-activity-style 'fg=colour1,bg=colour0,bold'

# Alternative styling options:
# setw -g window-status-activity-style 'fg=yellow,bg=default,blink'
# setw -g window-status-activity-style 'fg=red,bg=default,reverse'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

